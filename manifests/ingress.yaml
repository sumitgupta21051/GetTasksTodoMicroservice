apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: get-task-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
  - host: gettask.devops-engineer-adda.store
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: get-tasks
            port: 
              number: 80
